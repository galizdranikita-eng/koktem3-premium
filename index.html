function startBooking(service=null,doctor=null,edit=null){flow={step:1,service,doctor,date:null,time:null,edit};showTab('booking')}
function nav(){return `<div class="navrow">${flow.step>1?`<button class="btn light" onclick="flow.step--;renderBooking()">${tr('back')}</button>`:''}<button class="btn primary" onclick="nextStep()">${tr('next')}</button></div>`}
function renderBooking(){
 let h=`<div class="booking-wrap"><div class="steps">${[1,2,3,4].map(i=>`<div class="stepbar ${i<=Math.min(flow.step,4)?'on':''}"></div>`).join('')}</div>`;
 if(flow.step===1)h+=`<div class="title">${tr('selectService')}</div><div class="sub">${tr('servicesSub')}</div><div class="pick-grid">${B().services.map(s=>`<button class="pick-card ${flow.service===s.id?'sel':''}" onclick="flow.service='${s.id}';if(flow.doctor&&!serviceById('${s.id}').docs.includes(flow.doctor))flow.doctor=null;renderBooking()"><div class="icon">${s.ico}</div><b>${sName(s)}</b><small>${s['sub'+lang]||s.subru}</small></button>`).join('')}</div>${nav()}`;
 if(flow.step===2){const docs=B().doctors.filter(d=>(serviceById(flow.service)?.docs||[]).includes(d.id));h+=`<div class="title">${tr('selectDoctor')}</div>${docs.map(d=>{const i=d.name.split(' ').slice(0,2).map(x=>x[0]).join('');return `<button class="doctor-line ${flow.doctor===d.id?'sel':''}" onclick="flow.doctor='${d.id}';renderBooking()"><div class="thumb">${d.photo?`<img src="${d.photo}" alt="${esc(d.name)}" onerror="this.remove()">`:i}</div><div><b>${esc(d.name)}</b><small>${esc(dSpec(d))}</small></div></button>`}).join('')}${nav()}`;}
 if(flow.step===3){const ds=nextDates();h+=`<div class="title">${tr('selectDate')}</div><div class="sub">${tr('realSlots')}</div><div class="dates">${ds.map(d=>{const iso=isoDate(d);return `<button class="date ${flow.date===iso?'sel':''}" onclick="flow.date='${iso}';flow.time=null;renderBooking()"><span>${d.toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{weekday:'short'})}</span><strong>${d.getDate()}</strong><span>${d.toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{month:'short'})}</span></button>`}).join('')}</div>${flow.date?renderSlots():''}${nav()}`;}
 if(flow.step===4)h+=`<div class="title">${tr('patient')}</div><div class="summary"><div class="sumrow"><span>${tr('branchLabel')}</span><b>${branch==='dental'?tr('dental'):tr('med')}</b></div><div class="sumrow"><span>${tr('service')}</span><b>${sName(serviceById(flow.service))}</b></div><div class="sumrow"><span>${tr('doctor')}</span><b>${esc(doctorById(flow.doctor)?.name||'')}</b></div><div class="sumrow"><span>${tr('date')}</span><b>${dateLabel(flow.date)}</b></div><div class="sumrow"><span>${tr('time')}</span><b>${flow.time}</b></div></div><label class="label2">${tr('name')}</label><input id="bn" class="input"><label class="label2">${tr('phone')}</label><input id="bp" class="input" inputmode="tel"><label class="label2">${tr('comment')}</label><textarea id="bc" class="textarea" rows="3"></textarea><div class="navrow"><button class="btn light" onclick="flow.step--;renderBooking()">${tr('back')}</button><button class="btn primary" onclick="saveBookingFlow()">${tr('confirm')}</button></div>`;
 if(flow.step===5)h+=`<div style="text-align:center;padding:48px 10px"><div style="font-size:62px;color:var(--accent)">✓</div><div class="title">${tr('created')}</div><div class="sub">${tr('createdText')}</div><button class="btn primary" onclick="showTab('my')">${tr('my')}</button></div>`;
 h+='</div>';qs('#booking').innerHTML=h;
}
function nextStep(){if(flow.step===1&&!flow.service)return alert(tr('chooseService'));if(flow.step===2&&!flow.doctor)return alert(tr('chooseDoctor'));if(flow.step===3&&(!flow.date||!flow.time))return alert(tr('chooseTime'));flow.step++;renderBooking()}
function nextDates(){let a=[],d=new Date();for(let i=1;i<=10;i++){let x=new Date(d);x.setDate(d.getDate()+i);if(branch==='med'&&x.getDay()===0)continue;a.push(x)}return a}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(iso){return new Date(iso+'T12:00:00').toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{weekday:'short',day:'numeric',month:'long'})}
function currentSlots(){const s=getSlots(),key=sk(branch,flow.doctor,flow.date);return Array.isArray(s[key])?s[key]:['09:00','10:00','11:30','14:00','15:30','17:00']}
function renderSlots(){const av=currentSlots();return `<div class="section-head" style="margin-top:22px"><div><h2 style="font-size:25px">${tr('time')}</h2></div></div><div class="slots">${TIMES.map(t=>`<button class="slot ${flow.time===t?'sel':''} ${av.includes(t)?'':'disabled'}" ${av.includes(t)?`onclick="flow.time='${t}';renderBooking()"`:'disabled'}>${t}</button>`).join('')}</div>`}
function saveBookingFlow(){
 const n=qs('#bn').value.trim(),p=qs('#bp').value.trim(),c=qs('#bc').value.trim();if(n.length<2||p.length<7)return alert(lang==='ru'?'Укажите имя и телефон':'Аты-жөні мен телефонды енгізіңіз');
 let l=getBookings();
 if(flow.edit){const x=l.find(i=>i.id===flow.edit);if(x){x.branch=branch;x.serviceId=flow.service;x.service=sName(serviceById(flow.service));x.doctorId=flow.doctor;x.doctor=doctorById(flow.doctor).name;x.date=flow.date;x.dateLabel=dateLabel(flow.date);x.time=flow.time;x.status='Новая';x.comment=c;}}
 else l.unshift({id:Date.now(),branch,serviceId:flow.service,service:sName(serviceById(flow.service)),doctorId:flow.doctor,doctor:doctorById(flow.doctor).name,date:flow.date,dateLabel:dateLabel(flow.date),time:flow.time,name:n,phone:p,comment:c,status:'Новая'});
 saveBookings(l);flow.step=5;renderBooking()
}
function renderMy(){const l=getBookings();qs('#my').innerHTML=`<div class="booking-wrap"><div class="title">${tr('my')}</div><div class="sub">${tr('createdText')}</div>${l.length?l.map(cardBooking).join(''):`<div class="info-card"><div class="muted">${tr('noBookings')}</div></div>`}</div>`}
function cardBooking(x){return `<div class="appointment-card"><span class="badge ${badgeClass(x.status)}">${statusLabel(x.status)}</span><div style="height:8px"></div><b>${esc(x.service)}</b><div class="muted">${esc(x.doctor)} · ${esc(x.dateLabel)} · ${esc(x.time)}</div><div class="muted" style="margin-top:6px">${esc(x.name)} · ${esc(x.phone)}</div>${x.status!=='Отменена'?`<div class="actions"><button class="btn soft small" onclick="reschedule(${x.id})">${tr('reschedule')}</button><button class="btn light small" onclick="repeatBooking(${x.id})">${tr('repeat')}</button><button class="btn danger small" onclick="cancelBooking(${x.id})">${tr('cancel')}</button></div>`:''}</div>`}
function cancelBooking(id){if(!confirm(tr('cancel')+'?'))return;let l=getBookings(),x=l.find(i=>i.id===id);if(x)x.status='Отменена';saveBookings(l);renderMy()}
function reschedule(id){const x=getBookings().find(i=>i.id===id);if(!x)return;branch=x.branch;renderShell();flow={step:3,service:x.serviceId,doctor:x.doctorId,date:null,time:null,edit:id};showTab('booking')}
function repeatBooking(id){const x=getBookings().find(i=>i.id===id);if(!x)return;branch=x.branch;renderShell();startBooking(x.serviceId,x.doctorId,null)}
function renderPrices(){const a=getPrices()[branch];qs('#prices').innerHTML=`<div class="booking-wrap"><div class="title">${tr('priceTitle')}</div><div class="sub">${tr('priceText')}</div>${a.map(x=>`<div class="price-card"><b>${esc(x[lang]||x.ru)}</b><div class="price">${x.price?esc(x.price+' ₸'):tr('clarify')}</div></div>`).join('')}</div>`}
function renderAdmin(){
 if(localStorage.getItem('k3p_admin')!=='1'){qs('#admin').innerHTML=`<div class="booking-wrap"><div class="title">${tr('adminTitle')}</div><div class="sub">${tr('adminSub')}</div><div class="info-card"><label class="label2">${tr('pass')}</label><input id="ap" class="input" type="password"><div style="height:10px"></div><button class="btn primary" onclick="loginAdmin()">${tr('login')}</button><div class="note">${tr('demo')}</div></div></div>`;return}
 qs('#admin').innerHTML=`<div class="booking-wrap"><div class="title">${tr('adminTitle')}</div><div class="sub">${tr('adminSub')}</div><div class="admin-tabs"><button class="${adminMode==='requests'?'on':''}" onclick="adminMode='requests';renderAdmin()">${tr('requests')}</button><button class="${adminMode==='schedule'?'on':''}" onclick="adminMode='schedule';renderAdmin()">${tr('schedule')}</button><button class="${adminMode==='prices'?'on':''}" onclick="adminMode='prices';renderAdmin()">${tr('priceAdmin')}</button><button class="${adminMode==='reminders'?'on':''}" onclick="adminMode='reminders';renderAdmin()">${tr('reminders')}</button><button onclick="logoutAdmin()">×</button></div><div id="adminBody"></div></div>`;renderAdminBody()
}
function loginAdmin(){if(qs('#ap').value==='koktem3'){localStorage.setItem('k3p_admin','1');renderAdmin()}else alert('Wrong password')}
function logoutAdmin(){localStorage.removeItem('k3p_admin');renderAdmin()}
function renderAdminBody(){
 if(adminMode==='requests'){const l=getBookings();qs('#adminBody').innerHTML=l.length?l.map(x=>`<div class="admin-card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.service)}</div></div><button class="btn danger small" onclick="deleteReq(${x.id})">${tr('delete')}</button></div><div class="muted" style="margin-top:8px">${esc(x.doctor)} · ${esc(x.dateLabel)} · ${esc(x.time)}</div><label class="label2">${tr('status')}</label><select class="select" onchange="setStatus(${x.id},this.value)">${['Новая','Подтверждена','Завершена','Отменена'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></div>`).join(''):`<div class="info-card"><div class="muted">${tr('noBookings')}</div></div>`}
 if(adminMode==='schedule'){const ds=nextDates();qs('#adminBody').innerHTML=`<div class="admin-card"><label class="label2">${tr('chooseAdminDoctor')}</label><select id="adoc" class="select" onchange="renderSlotEditor()">${B().doctors.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><label class="label2">${tr('chooseAdminDate')}</label><select id="adate" class="select" onchange="renderSlotEditor()">${ds.map(d=>{const iso=isoDate(d);return `<option value="${iso}">${dateLabel(iso)}</option>`}).join('')}</select><div id="slotEditor"></div></div>`;renderSlotEditor()}
 if(adminMode==='prices'){const a=getPrices()[branch];qs('#adminBody').innerHTML=a.map(x=>`<div class="price-card"><b>${esc(x[lang]||x.ru)}</b><input class="input pe" data-id="${x.id}" value="${esc(x.price)}" inputmode="numeric" style="margin-top:8px"></div>`).join('')+`<button class="btn primary" onclick="saveAdminPrices()">${tr('savePrices')}</button>`}
 if(adminMode==='reminders'){const l=getBookings().filter(x=>x.status!=='Отменена');qs('#adminBody').innerHTML=`<div class="note">${tr('reminderText')}</div><div style="height:10px"></div>${l.map(x=>`<div class="admin-card"><b>${esc(x.name)}</b><div class="muted">${esc(x.dateLabel)} · ${esc(x.time)} · ${esc(x.doctor)}</div><div style="height:8px"></div><button class="btn soft small" onclick="sendReminder(${x.id})">${tr('sendWA')}</button></div>`).join('')}`}
}
function deleteReq(id){if(!confirm(tr('delete')+'?'))return;saveBookings(getBookings().filter(x=>x.id!==id));renderAdminBody()}
function setStatus(id,v){let l=getBookings(),x=l.find(i=>i.id===id);if(x)x.status=v;saveBookings(l)}
function renderSlotEditor(){const d=qs('#adoc')?.value,dt=qs('#adate')?.value;if(!d||!dt)return;const s=getSlots(),key=sk(branch,d,dt),active=Array.isArray(s[key])?s[key]:['09:00','10:00','11:30','14:00','15:30','17:00'];qs('#slotEditor').innerHTML=`<div class="section-head" style="margin-top:20px"><div><h2 style="font-size:25px">${tr('openSlots')}</h2></div></div><div class="slots">${TIMES.map(t=>`<button class="slot ${active.includes(t)?'sel':''}" data-time="${t}" onclick="this.classList.toggle('sel')">${t}</button>`).join('')}</div><div style="height:10px"></div><button class="btn primary" onclick="saveAdminSlots('${d}','${dt}')">${tr('saveSlots')}</button>`}
function saveAdminSlots(d,dt){const active=[...document.querySelectorAll('#slotEditor .slot.sel')].map(x=>x.dataset.time),s=getSlots();s[sk(branch,d,dt)]=active;saveSlots(s);alert(tr('saved'))}
function saveAdminPrices(){const all=getPrices(),a=all[branch];document.querySelectorAll('.pe').forEach(i=>{const x=a.find(p=>p.id===i.dataset.id);if(x)x.price=i.value.replace(/[^\d]/g,'')});savePrices(all);alert(tr('pricesSaved'))}
function sendReminder(id){const x=getBookings().find(i=>i.id===id);if(!x)return;const msg=lang==='ru'?`Здравствуйте, ${x.name}! Напоминаем о записи в «Коктем‑3»: ${x.dateLabel}, ${x.time}. Врач: ${x.doctor}.`:`Сәлеметсіз бе, ${x.name}! «Коктем‑3» орталығындағы жазылуыңызды еске саламыз: ${x.dateLabel}, ${x.time}. Дәрігер: ${x.doctor}.`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
renderShell();renderHome();
</script>
</body>
</html>
