function renderHome(){const b=B(); $('page-home').innerHTML=`<div class="hero"><div class="hero-main"><span class="kicker">${t('heroKicker')}</span><h1>${state.branch==='dental'?t('heroDental'):t('heroMed')}</h1><p>${state.branch==='dental'?t('heroDentalText'):t('heroMedText')}</p><div class="hero-actions"><button class="btn primary" onclick="startBooking()">${t('cta1')}</button><button class="btn secondary" onclick="openWA()">${t('cta2')}</button></div></div><div class="hero-side"><div class="visual-card"><h3>${t('whyTitle')}</h3><p>${t('whyText')}</p><div class="stats">${T[state.lang].features.map(f=>`<div class="stat"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div></div></div></div><div class="section"><div class="section-head"><h2>${t('servTitle')}</h2><p>${t('servText')}</p></div><div class="grid-4">${b.services.map(s=>`<div class="card service-card"><div class="icon">${s.icon}</div><b>${serviceName(s)}</b><small>${serviceSub(s)}</small><div class="actions"><button class="btn outline small" onclick="pickService('${s.id}')">${t('cta1')}</button></div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>${t('docTitle')}</h2><p>${t('docText')}</p></div><div class="grid-3">${b.doctors.filter(d=>!d.pseudo).map(d=>`<div class="card doctor-card"><div class="doctor-photo"><img src="${d.photo}" alt="${d.name}"></div><div class="doctor-body"><b>${d.name}</b><small>${docRole(d)}</small>${isBookableDoctor(d)?`<button class="btn outline small" onclick="pickDoctor('${d.id}')">${t('cta1')}</button>`:`<span class="badge ${d.available===false?'cancel':''}">${d.available===false?(state.lang==='ru'?'Временно не принимает':'Уақытша қабылдамайды'):(state.lang==='ru'?'Команда клиники':'Клиника командасы')}</span>`}</div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>${t('equipTitle')}</h2><p>${t('equipText')}</p></div><div class="grid-3">${b.equipment.map(e=>`<div class="card visual-grid-card"><div class="visual-photo"><img src="${e.img}" alt="${state.lang==='ru'?e.titleRu:e.titleKk}"></div><div class="visual-body"><b>${state.lang==='ru'?e.titleRu:e.titleKk}</b><small>${state.lang==='ru'?e.descRu:e.descKk}</small></div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>${t('newsTitle')}</h2><p>${t('newsText')}</p></div><div class="grid-3">${b.news.map(n=>`<div class="card visual-grid-card"><div class="visual-photo news-photo"><img src="${n.img}" alt="${state.lang==='ru'?n.titleRu:n.titleKk}"></div><div class="visual-body"><b>${state.lang==='ru'?n.titleRu:n.titleKk}</b><small>${state.lang==='ru'?n.textRu:n.textKk}</small></div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>${t('contactTitle')}</h2><p>${t('contactText')}</p></div><div class="contact-layout"><div class="card contact-card"><div class="contact-line"><div class="dot">☎</div><div><b>${t('contact')}</b><span>${b.phones.join('<br>')}</span></div></div><div class="contact-line"><div class="dot">⌖</div><div><b>${t('location')}</b><span>${b.address}</span></div></div><div class="contact-line"><div class="dot">⏰</div><div><b>${t('hours')}</b><span>${b.hours}</span></div></div><div class="contact-line"><div class="dot">★</div><div><b>${t('advantages')}</b><span>${T[state.lang].features.map(x=>x[0]).join(' · ')}</span></div></div><div class="map-actions"><a class="btn map-primary small" target="_blank" href="${b.maps.dgis}">${t('open2gis')}</a><a class="btn outline small" target="_blank" href="${b.maps.google}">${t('openGoogle')}</a><a class="btn outline small" target="_blank" href="${b.maps.yandex}">${t('openYandex')}</a></div></div><a class="card contact-card map-2gis" target="_blank" href="${b.maps.dgis}" aria-label="2GIS — ${b.address}"><div class="dgis-badge">2GIS · ${state.branch==='dental'?t('dental'):t('med')}</div><div class="dgis-pin"></div><div class="dgis-address"><b>${b.address}</b><span>${t('open2gis')} →</span></div></a></div></div>`}
function pickService(id){state.service=id;state.doctor=null;state.date=null;state.slot=null;startBooking(false);state.step=1;renderBooking()} function pickDoctor(id){state.doctor=id;state.service=null;state.date=null;state.slot=null;startBooking(false);state.step=0;renderBooking()}
function getService(){return B().services.find(s=>s.id===state.service)} function getDoctor(){return B().doctors.find(d=>d.id===state.doctor)}
function renderBooking(){
 const selectedService=getService(), selectedDoctor=getDoctor();
 const serviceChoices=state.doctor ? B().services.filter(x=>(x.docs||[]).includes(state.doctor)) : B().services;
 const doctorChoices=selectedService ? (selectedService.docs||[]).map(id=>B().doctors.find(d=>d.id===id)).filter(Boolean) : [];
 let content='';
 if(state.step===0){
   content=`${state.doctor?`<div class="summary"><div class="row"><span>${t('doctor')}</span><b>${selectedDoctor?selectedDoctor.name:''}</b></div></div>`:''}<div class="select-grid">${serviceChoices.map(x=>`<div class="select-card ${state.service===x.id?'selected':''}" onclick="state.service='${x.id}'; if(state.doctor && (B().services.find(s=>s.id==='${x.id}').docs||[]).includes(state.doctor)){state.step=2}else{state.doctor=null;state.step=1}; renderBooking()"><b>${x.icon} ${serviceName(x)}</b><small>${serviceSub(x)}</small></div>`).join('')}</div>`;
 }
 if(state.step===1){
   content=`${selectedService?`<div class="summary"><div class="row"><span>${t('service')}</span><b>${selectedService.icon} ${serviceName(selectedService)}</b></div></div>`:''}${doctorChoices.map(x=>`<div class="doctor-line ${state.doctor===x.id?'selected':''}" onclick="state.doctor='${x.id}'; state.step=2; renderBooking()"><div class="thumb"><img src="${x.photo}" alt="${x.name}"></div><div><b>${x.name}</b><small>${docRole(x)}</small></div></div>`).join('')}`;
 }
 if(state.step===2){
   content=`${selectedService||selectedDoctor?`<div class="summary">${selectedService?`<div class="row"><span>${t('service')}</span><b>${selectedService.icon} ${serviceName(selectedService)}</b></div>`:''}${selectedDoctor?`<div class="row"><span>${t('doctor')}</span><b>${selectedDoctor.name}</b></div>`:''}</div>`:''}<div class="date-row">${dateOptions.map((x,i)=>`<div class="date-chip ${state.date===i?'selected':''}" onclick="state.date=${i}; renderBooking()"><span>${x.toLocaleDateString(state.lang==='ru'?'ru-RU':'kk-KZ',{weekday:'short'})}</span><strong>${x.getDate()}</strong><span>${x.toLocaleDateString(state.lang==='ru'?'ru-RU':'kk-KZ',{month:'short'})}</span></div>`).join('')}</div>${state.date!==null?`<div style="height:10px"></div><div class="slot-grid">${currentSlots().map((x,idx)=>`<div class="slot ${state.slot===x?'selected':''} ${idx===1?'disabled':''}" onclick="${idx===1?'':`state.slot='${x}'; state.step=3; renderBooking()`}">${x}</div>`).join('')}</div>`:''}`;
 }
 if(state.step===3){
   content=`<div class="summary">${selectedService?`<div class="row"><span>${t('service')}</span><b>${selectedService.icon} ${serviceName(selectedService)}</b></div>`:''}${selectedDoctor?`<div class="row"><span>${t('doctor')}</span><b>${selectedDoctor.name}</b></div>`:''}${state.date!==null?`<div class="row"><span>${t('date')}</span><b>${fmt(dateOptions[state.date])}</b></div>`:''}${state.slot?`<div class="row"><span>${t('time')}</span><b>${state.slot}</b></div>`:''}</div><label class="label">${t('name')}</label><input id="patientName" class="input"><label class="label">${t('phone')}</label><input id="patientPhone" class="input"><label class="label">${t('comment')}</label><textarea id="patientComment" class="textarea"></textarea>`;
 }

}
function saveBooking(){const name=$('patientName').value.trim(), phone=$('patientPhone').value.trim(); if(!name||!phone){alert('Заполните имя и телефон'); return;} const arr=bookings(); const s=getService(), d=getDoctor(); arr.unshift({id:Date.now(), branch:state.branch, service:s?serviceName(s):'', doctor:d?d.name:'', date:state.date!==null?fmt(dateOptions[state.date]):'', time:state.slot||'', name, phone, comment:$('patientComment').value.trim(), status:'new'}); setBookings(arr); alert(`${t('saved')}\n${t('savedText')}`); state.step=0; state.service=null; state.doctor=null; state.date=null; state.slot=null; showPage('my')}
function renderMy(){const arr=bookings(); $('page-my').innerHTML=`<h1 class="title">${t('my')}</h1><div class="sub">${t('savedText')}</div>${arr.length?arr.map(b=>`<div class="appt-card"><span class="badge ${b.status==='cancelled'?'cancel':''}">${b.status}</span><div class="row"><span>${t('branch')}</span><b>${b.branch==='dental'?t('dental'):t('med')}</b></div><div class="row"><span>${t('service')}</span><b>${b.service}</b></div><div class="row"><span>${t('doctor')}</span><b>${b.doctor}</b></div><div class="row"><span>${t('date')}</span><b>${b.date}</b></div><div class="row"><span>${t('time')}</span><b>${b.time}</b></div><div class="muted">${b.name} · ${b.phone}</div><div class="actions"><button class="btn outline small" onclick="repeatBooking('${b.branch}','${b.service}')">${t('repeat')}</button><button class="btn outline small" onclick="cancelBooking(${b.id})">${t('cancel')}</button></div></div>`).join(''):`<div class="card contact-card"><div class="muted">${t('noBookings')}</div></div>`}`}
function repeatBooking(branch, svc){state.branch=branch; savePrefs(); const found=B().services.find(x=>svc===x.ru||svc===x.kk); state.service=found?found.id:null; state.doctor=null; startBooking(false); if(found) state.step=1; renderAll()} function cancelBooking(id){setBookings(bookings().map(x=>x.id===id?{...x,status:'cancelled'}:x)); renderMy(); if(state.admin) renderAdmin()}
function renderPrices(){const arr=currentPrices(); $('page-prices').innerHTML=`<h1 class="title">${t('prices')}</h1><div class="sub">${t('pricesSub')}</div>${arr.map(p=>`<div class="price-card"><div class="price-row"><div><b>${state.lang==='ru'?p.nameRu:p.nameKk}</b></div><div><b>${p.price}</b></div></div><div class="actions"><button class="btn outline small">${t('clarify')}</button></div></div>`).join('')}`}
function adminLogin(){if($('adminPass').value.trim()==='koktem3'){state.admin=true; renderAdmin()} else alert('Wrong password')}
function setAdminTab(tab){state.adminTab=tab; renderAdmin()} function saveAdminSlots(){const v=$('slotInput').value.split(',').map(x=>x.trim()).filter(Boolean); const a=adminData(); a[state.branch+'_slots']=v; setAdminData(a); alert(t('save'))} function saveAdminPrices(){const rows=[...document.querySelectorAll('[data-price-row]')].map(r=>({nameRu:r.querySelector('[data-ru]').value,nameKk:r.querySelector('[data-kk]').value,price:r.querySelector('[data-price]').value})); const a=adminData(); a[state.branch+'_prices']=rows; setAdminData(a); alert(t('save')); renderPrices()}
function changeStatus(id,status){setBookings(bookings().map(x=>x.id===id?{...x,status}:x)); renderAdmin()}
function renderAdmin(){if(!state.admin){$('page-admin').innerHTML=`<div class="login"><h1 class="title">${t('adminTitle')}</h1><div class="sub">${t('adminSub')}</div><div class="card contact-card"><label class="label">${t('pass')}</label><input id="adminPass" class="input" type="password"><div class="note" style="margin-top:12px">${t('demoPass')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="adminLogin()">${t('login')}</button></div></div></div>`; return;} const tabs=`<div class="admin-tabs"><button class="${state.adminTab==='requests'?'active':''}" onclick="setAdminTab('requests')">${t('requests')}</button><button class="${state.adminTab==='schedule'?'active':''}" onclick="setAdminTab('schedule')">${t('schedule')}</button><button class="${state.adminTab==='prices'?'active':''}" onclick="setAdminTab('prices')">${t('priceAdmin')}</button><button class="${state.adminTab==='reminders'?'active':''}" onclick="setAdminTab('reminders')">${t('reminders')}</button></div>`; let body=''; if(state.adminTab==='requests'){const arr=bookings(); body=arr.length?arr.map(b=>`<div class="admin-card"><div class="row"><span>${t('service')}</span><b>${b.service}</b></div><div class="row"><span>${t('doctor')}</span><b>${b.doctor}</b></div><div class="row"><span>${t('date')}</span><b>${b.date} ${b.time}</b></div><div class="muted">${b.name} · ${b.phone}</div><div class="actions"><button class="btn outline small" onclick="changeStatus(${b.id},'confirmed')">confirmed</button><button class="btn outline small" onclick="changeStatus(${b.id},'cancelled')">cancelled</button></div></div>`).join(''):`<div class="card contact-card"><div class="muted">${t('noBookings')}</div></div>`;} if(state.adminTab==='schedule'){body=`<div class="admin-card"><label class="label">${t('slots')}</label><textarea id="slotInput" class="textarea">${currentSlots().join(', ')}</textarea><div class="actions"><button class="btn primary" onclick="saveAdminSlots()">${t('save')}</button></div></div>`;} if(state.adminTab==='prices'){body=`<div class="admin-card">${currentPrices().map(p=>`<div data-price-row style="padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)"><label class="label">RU</label><input data-ru class="input" value="${p.nameRu}"><label class="label">KZ</label><input data-kk class="input" value="${p.nameKk}"><label class="label">₸</label><input data-price class="input" value="${p.price}"></div>`).join('')}<div class="actions"><button class="btn primary" onclick="saveAdminPrices()">${t('save')}</button></div></div>`;} if(state.adminTab==='reminders'){body=`<div class="note">${t('waHint')}</div><div style="height:12px"></div>${bookings().map(b=>`<div class="admin-card"><b>${b.name}</b><div class="muted">${b.date} · ${b.time} · ${b.phone}</div><div class="actions"><a class="btn outline small" target="_blank" href="https://wa.me/${b.phone.replace(/\D/g,'')}?text=${encodeURIComponent('Напоминаем о записи в Коктем-3 на '+b.date+' в '+b.time)}">WhatsApp</a></div></div>`).join('')}`;}
 $('page-admin').innerHTML=`<h1 class="title">${t('adminTitle')}</h1><div class="sub">${t('adminSub')}</div>${tabs}${body}`}
function renderAll(){renderHeader(); renderHome(); renderBooking(); renderMy(); renderPrices(); renderAdmin(); showPage(state.page)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
renderAll();
</script>
</body>
</html>
