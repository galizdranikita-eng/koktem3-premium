<style>
:root{
  --bg:#f4f7fb; --paper:#ffffff; --ink:#17324d; --muted:#6f8396; --line:#dbe5f0;
  --brand:#113b63; --brand2:#1f6fa5; --accent:#1aa3a8; --soft:#edf4fa; --gold:#c6a979;
  --shadow:0 18px 45px rgba(18,42,66,.09); --shadow2:0 8px 20px rgba(18,42,66,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;justify-content:center}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#app{width:100%;min-height:100vh}
.shell{width:min(1200px,100%);margin:0 auto}
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(219,229,240,.9)}
.topbar .shell{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:var(--shadow2)}
.brand b{display:block;font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.pill button{border:0;background:transparent;padding:10px 14px;border-radius:999px;font-size:11px;font-weight:800;color:#57708a}
.pill button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow2)}
.page{display:none;padding:24px 20px 120px}.page.active{display:block}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:stretch}
.hero-main{background:linear-gradient(135deg,#14395d,#1f6fa5);color:#fff;border-radius:34px;padding:38px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-main:before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-130px;border:1px solid rgba(255,255,255,.16);border-radius:50%}
.hero-main:after{content:"";position:absolute;width:280px;height:280px;left:-120px;bottom:-130px;background:rgba(255,255,255,.05);border-radius:50%}
.kicker{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.11);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.hero-main h1{font-size:48px;line-height:1.02;letter-spacing:-1.5px;margin:18px 0 12px;max-width:650px}
.hero-main p{max-width:620px;font-size:15px;line-height:1.65;color:#e4eef8;margin:0 0 22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;min-height:48px;padding:0 20px;font-size:13px;font-weight:800}
.btn.primary{background:#fff;color:var(--brand)}
.btn.secondary{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn.outline{background:#fff;border:1px solid var(--line);color:var(--brand)}
.btn.small{min-height:38px;padding:0 14px;font-size:11px}
.hero-side{display:grid;gap:18px}
.side-card{background:#fff;border:1px solid var(--line);border-radius:30px;padding:24px;box-shadow:var(--shadow2)}
.side-card h3{margin:0 0 10px;font-size:24px;letter-spacing:-.6px}
.side-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.mini-item{background:var(--soft);border-radius:18px;padding:14px}
.mini-item b{display:block;font-size:14px}.mini-item span{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.section{margin-top:28px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
.section-head h2{margin:0;font-size:32px;letter-spacing:-.8px}
.section-head p{margin:0;color:var(--muted);font-size:13px;max-width:560px;line-height:1.55}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow2)}
.feature-card{padding:18px}
.feature-card .icon{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.feature-card b{display:block;font-size:15px;margin-bottom:5px}.feature-card small{font-size:12px;line-height:1.5;color:var(--muted)}
.service-card{padding:20px;min-height:156px;position:relative;overflow:hidden}
.service-card:after{content:"";position:absolute;width:110px;height:110px;right:-35px;bottom:-35px;border-radius:50%;background:rgba(31,111,165,.08)}
.service-card .icon{font-size:24px}
.service-card b{display:block;margin:14px 0 7px;font-size:16px}
.service-card small{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.doctor-card{overflow:hidden}
.doctor-photo{height:320px;background:linear-gradient(135deg,#dde8f2,#f8fbff)}
.doctor-photo img{width:100%;height:100%;object-fit:cover;display:block}
.doctor-body{padding:18px}
.doctor-body b{display:block;font-size:16px;line-height:1.35}.doctor-body small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin:6px 0 14px}
.equip-card{overflow:hidden}
.equip-photo{height:220px;background:#edf4fa}
.equip-photo img{width:100%;height:100%;object-fit:cover;display:block}
.equip-body{padding:18px}
.equip-body b{display:block;font-size:16px;line-height:1.35;margin-bottom:6px}.equip-body small{display:block;color:var(--muted);font-size:12px;line-height:1.55}
.news-card{overflow:hidden}
.news-photo{height:180px;background:#edf4fa}
.news-photo img{width:100%;height:100%;object-fit:cover;display:block}
.news-body{padding:18px}
.tag{display:inline-block;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:10px;font-weight:800;margin-bottom:10px}
.news-body b{display:block;font-size:16px;line-height:1.4;margin-bottom:7px}
.news-body p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.info-band{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info-card{padding:24px}
.info-card h3{margin:0 0 10px;font-size:24px}.info-card p,.info-card li{color:var(--muted);font-size:13px;line-height:1.65}
.info-card ul{margin:10px 0 0 18px;padding:0}
.booking-wrap{max-width:860px;margin:0 auto}
.title{font-size:38px;line-height:1.03;margin:0 0 8px;letter-spacing:-.8px}
.sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}
.steps{display:flex;gap:6px;margin-bottom:16px}.step{height:6px;border-radius:999px;background:#d9e4ef;flex:1}.step.active{background:var(--brand2)}
.select-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.select-card,.doctor-line,.date-chip,.slot,.appt-card,.price-card,.admin-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow2)}
.select-card{padding:18px}.select-card.selected,.doctor-line.selected,.date-chip.selected,.slot.selected{outline:3px solid rgba(31,111,165,.12);border-color:#95b8d3}
.select-card b{display:block;font-size:15px;margin-bottom:5px}.select-card small{font-size:12px;color:var(--muted)}
.doctor-line{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px}
.thumb{width:72px;height:72px;border-radius:18px;overflow:hidden;background:#e7eef5;flex:0 0 72px}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.doctor-line b{display:block;font-size:14px}.doctor-line small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.date-row{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.date-row::-webkit-scrollbar{display:none}
.date-chip{min-width:84px;padding:12px 8px;text-align:center}.date-chip span{display:block;font-size:10px;color:var(--muted)}.date-chip strong{display:block;font-size:22px;margin:3px 0}
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:12px 8px;text-align:center;font-size:12px;font-weight:800}.slot.disabled{opacity:.35;text-decoration:line-through}
.label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}
.input,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;outline:none;box-shadow:var(--shadow2)}
.textarea{min-height:90px;resize:vertical}
.summary{padding:16px;border-radius:20px;background:#f9fbfe;border:1px solid var(--line);margin-top:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px}.row span{color:var(--muted)}
.navrow{display:flex;gap:10px;align-items:center;margin-top:18px}
.navrow .spacer{flex:1}
.appt-card,.price-card,.admin-card{padding:16px;margin-bottom:10px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;background:#ecf4fb;color:var(--brand2)}
.badge.ok{background:#e5f7f2;color:#1a7a63}.badge.cancel{background:#fdeceb;color:#af4d4a}
.muted{font-size:12px;color:var(--muted);line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.price-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.price-row:last-child{border-bottom:0}
.login{max-width:420px;margin:0 auto 16px}
.admin-tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px;margin-bottom:16px;overflow:auto}.admin-tabs button{border:0;background:transparent;padding:10px 14px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;color:#57708a}.admin-tabs button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow2)}
.note{padding:14px;border-radius:18px;background:#fffaf0;border:1px solid #f0e2c8;color:#84663c;font-size:12px;line-height:1.55}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:95;width:min(94%,560px);height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;box-shadow:0 16px 36px rgba(18,42,66,.14);display:none;overflow:hidden}
.bottom button{flex:1;border:0;background:transparent;font-size:10px;font-weight:800;color:#688097}.bottom button i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}.bottom button.active{color:var(--brand)}
@media (max-width:980px){
 .hero{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}
 .info-band{grid-template-columns:1fr}.doctor-photo{height:290px}.slot-grid{grid-template-columns:repeat(3,1fr)}
 .bottom{display:flex}.page{padding-bottom:100px}
}
@media (max-width:640px){
 .topbar .shell{padding:12px 14px}.brand small{display:none}.page{padding:16px 14px 100px}
 .hero-main{padding:28px;border-radius:28px}.hero-main h1{font-size:34px}.hero-main p{font-size:13px}.side-card{border-radius:24px}
 .section-head h2{font-size:28px}.section-head p{display:none}.grid-4,.grid-3,.select-grid{grid-template-columns:1fr}
 .doctor-card,.equip-card,.news-card{min-width:0}.slot-grid{grid-template-columns:repeat(3,1fr)}.title{font-size:32px}
}
</style>
</head>

          <li>${txt('advantage1')}</li>
          <li>${txt('advantage2')}</li>
          <li>${txt('advantage3')}</li>
          <li>${txt('advantage4')}</li>
        </ul>
        <div class="actions"><button class="btn outline small" onclick="startBooking()">${txt('primaryCTA')}</button><button class="btn outline small" onclick="openWhatsApp()">WhatsApp</button></div>
     </div>
   </div>
 </div>`;
}
function selectServiceAndBook(id){state.selectedService=id; state.selectedDoctor=null; state.selectedDate=null; state.selectedSlot=null; startBooking(); state.bookingStep=1; renderBooking()}
function selectDoctorAndBook(id){state.selectedDoctor=id; state.selectedDate=null; state.selectedSlot=null; startBooking(); state.bookingStep=2; renderBooking()}
function getSelectedService(){return branchData().services.find(s=>s.id===state.selectedService)}
function getSelectedDoctor(){return branchData().doctors.find(d=>d.id===state.selectedDoctor)}
function renderBooking(){const b=branchData(); const el=$('page-booking'); const selectedService=getSelectedService(); const selectedDoctor=getSelectedDoctor();
 const steps=`<div class="steps"><div class="step ${state.bookingStep>=0?'active':''}"></div><div class="step ${state.bookingStep>=1?'active':''}"></div><div class="step ${state.bookingStep>=2?'active':''}"></div><div class="step ${state.bookingStep>=3?'active':''}"></div></div>`;
 let content='';
 if(state.bookingStep===0){content=`<div class="select-grid">${b.services.map(s=>`<div class="select-card ${state.selectedService===s.id?'selected':''}" onclick="state.selectedService='${s.id}';state.bookingStep=1;renderBooking()"><b>${serviceName(s)}</b><small>${serviceSub(s)}</small></div>`).join('')}</div>`;}
 if(state.bookingStep===1){content=`${selectedService?`<div class="summary"><div class="row"><span>${txt('service')}</span><b>${serviceName(selectedService)}</b></div></div>`:''}<div>${b.doctors.map(d=>`<div class="doctor-line ${state.selectedDoctor===d.id?'selected':''}" onclick="state.selectedDoctor='${d.id}';state.bookingStep=2;renderBooking()"><div class="thumb"><img src="${d.photo}" alt="${d.name}"></div><div><b>${d.name}</b><small>${docRole(d)}</small></div></div>`).join('')}</div>`;}
 if(state.bookingStep===2){content=`${selectedService?`<div class="summary"><div class="row"><span>${txt('service')}</span><b>${serviceName(selectedService)}</b></div>${selectedDoctor?`<div class="row"><span>${txt('doctor')}</span><b>${selectedDoctor.name}</b></div>`:''}</div>`:''}<div class="date-row">${dateOptions.map((d,i)=>`<div class="date-chip ${state.selectedDate===i?'selected':''}" onclick="state.selectedDate=${i};renderBooking()"><span>${d.toLocaleDateString(state.lang==='ru'?'ru-RU':'kk-KZ',{weekday:'short'})}</span><strong>${d.getDate()}</strong><span>${d.toLocaleDateString(state.lang==='ru'?'ru-RU':'kk-KZ',{month:'short'})}</span></div>`).join('')}</div>${state.selectedDate!==null?`<div style="height:10px"></div><div class="slot-grid">${mergedSlots().map((s,idx)=>`<div class="slot ${state.selectedSlot===s?'selected':''} ${idx===2?'disabled':''}" onclick="${idx===2?'':`state.selectedSlot='${s}';state.bookingStep=3;renderBooking()`}">${s}</div>`).join('')}</div>`:''}`;}
 if(state.bookingStep===3){content=`<div class="summary">${selectedService?`<div class="row"><span>${txt('service')}</span><b>${serviceName(selectedService)}</b></div>`:''}${selectedDoctor?`<div class="row"><span>${txt('doctor')}</span><b>${selectedDoctor.name}</b></div>`:''}${state.selectedDate!==null?`<div class="row"><span>${txt('date')}</span><b>${formatDate(dateOptions[state.selectedDate])}</b></div>`:''}${state.selectedSlot?`<div class="row"><span>${txt('time')}</span><b>${state.selectedSlot}</b></div>`:''}</div><label class="label">${txt('name')}</label><input id="patientName" class="input" placeholder="${txt('name')}"><label class="label">${txt('phone')}</label><input id="patientPhone" class="input" placeholder="+7 ..."><label class="label">${txt('comment')}</label><textarea id="patientComment" class="textarea" placeholder="${txt('comment')}"></textarea>`;}
 el.innerHTML=`<div class="booking-wrap"><h1 class="title">${txt('bookTitle')}</h1><div class="sub">${txt('bookSub')}</div>${steps}<div class="card" style="padding:18px">${content}<div class="navrow">${state.bookingStep>0?`<button class="btn outline" onclick="state.bookingStep--; renderBooking()">${txt('back')}</button>`:''}<div class="spacer"></div>${state.bookingStep===3?`<button class="btn primary" onclick="saveBooking()">${txt('confirm')}</button>`:''}</div></div></div>`;
}
function saveBooking(){
 const name=$('patientName').value.trim(); const phone=$('patientPhone').value.trim(); if(!name||!phone){alert('Заполните имя и телефон'); return;}
 const bookings=getBookings(); const service=getSelectedService(); const doctor=getSelectedDoctor();
 bookings.unshift({id:Date.now(), branch:state.branch, service:service?serviceName(service):'', doctor:doctor?doctor.name:'', date:state.selectedDate!==null?formatDate(dateOptions[state.selectedDate]):'', time:state.selectedSlot||'', name, phone, comment:$('patientComment').value.trim(), status:'new'});
 setBookings(bookings); alert(txt('bookingSaved')+'\n'+txt('bookingSavedText')); state.bookingStep=0; state.selectedService=null; state.selectedDoctor=null; state.selectedDate=null; state.selectedSlot=null; showPage('my');
}
function renderMy(){const bookings=getBookings(); const el=$('page-my');
 el.innerHTML=`<h1 class="title">${txt('my')}</h1><div class="sub">${txt('bookingSavedText')}</div>${bookings.length?bookings.map(b=>`<div class="appt-card"><span class="badge ${b.status==='confirmed'?'ok':b.status==='cancelled'?'cancel':''}">${b.status}</span><div class="row"><span>${txt('branch')}</span><b>${b.branch==='dental'?txt('dental'):txt('med')}</b></div><div class="row"><span>${txt('service')}</span><b>${b.service}</b></div><div class="row"><span>${txt('doctor')}</span><b>${b.doctor}</b></div><div class="row"><span>${txt('date')}</span><b>${b.date}</b></div><div class="row"><span>${txt('time')}</span><b>${b.time}</b></div><div class="muted">${b.name} · ${b.phone}${b.comment?` · ${b.comment}`:''}</div><div class="actions"><button class="btn outline small" onclick="repeatBooking('${b.branch}','${b.service}')">${txt('repeat')}</button><button class="btn outline small" onclick="cancelBooking(${b.id})">${txt('cancel')}</button></div></div>`).join(''):`<div class="card info-card"><p>${txt('noBookings')}</p></div>`}`;
}
function repeatBooking(branch,service){state.branch=branch; const b=branchData(); const found=b.services.find(s=>service===s.ru||service===s.kk); state.selectedService=found?found.id:null; savePrefs(); startBooking(); if(found) state.bookingStep=1; renderBooking()}
function cancelBooking(id){const arr=getBookings().map(x=>x.id===id?{...x,status:'cancelled'}:x); setBookings(arr); renderMy(); if(state.adminLogged) renderAdmin();}
function renderPrices(){const prices=mergedPrices(); $('page-prices').innerHTML=`<h1 class="title">${txt('pricesTitle')}</h1><div class="sub">${txt('pricesSub')}</div>${prices.map((p,i)=>`<div class="price-card"><div class="price-row"><div><b>${state.lang==='ru'?p.nameRu:p.nameKk}</b></div><div><b>${p.price}</b></div></div><div class="actions"><button class="btn outline small">${txt('clarify')}</button></div></div>`).join('')}`;}
function adminLogin(){const v=$('adminPass').value.trim(); if(v==='koktem3'){state.adminLogged=true; renderAdmin()} else alert('Неверный пароль');}
function setAdminTab(tab){state.adminTab=tab; renderAdmin()}
function saveAdminPrices(){const blocks=[...document.querySelectorAll('[data-price-row]')].map((row,idx)=>({nameRu:row.querySelector('[data-ru]').value,nameKk:row.querySelector('[data-kk]').value,price:row.querySelector('[data-price]').value})); const admin=getAdmin(); admin[state.branch+'_prices']=blocks; setAdmin(admin); alert(txt('saved')); renderPrices();}
function saveAdminSlots(){const slots=$('slotInput').value.split(',').map(s=>s.trim()).filter(Boolean); const admin=getAdmin(); admin[state.branch+'_slots']=slots; setAdmin(admin); alert(txt('saved'));}
function renderAdmin(){const el=$('page-admin'); if(!state.adminLogged){el.innerHTML=`<div class="login"><h1 class="title">${txt('adminTitle')}</h1><div class="sub">${txt('adminSub')}</div><div class="card info-card"><label class="label">${txt('pass')}</label><input id="adminPass" class="input" type="password"><div class="note" style="margin-top:12px">${txt('demoPass')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="adminLogin()">${txt('login')}</button></div></div></div>`; return;}
 const bookings=getBookings(); const prices=mergedPrices(); const tabs=`<div class="admin-tabs"><button class="${state.adminTab==='requests'?'active':''}" onclick="setAdminTab('requests')">${txt('requests')}</button><button class="${state.adminTab==='schedule'?'active':''}" onclick="setAdminTab('schedule')">${txt('schedule')}</button><button class="${state.adminTab==='prices'?'active':''}" onclick="setAdminTab('prices')">${txt('priceAdmin')}</button><button class="${state.adminTab==='reminders'?'active':''}" onclick="setAdminTab('reminders')">${txt('reminders')}</button></div>`;
 let body='';
 if(state.adminTab==='requests') body=bookings.length?bookings.map(b=>`<div class="admin-card"><div class="row"><span>${txt('branch')}</span><b>${b.branch==='dental'?txt('dental'):txt('med')}</b></div><div class="row"><span>${txt('service')}</span><b>${b.service}</b></div><div class="row"><span>${txt('doctor')}</span><b>${b.doctor}</b></div><div class="row"><span>${txt('date')}</span><b>${b.date} ${b.time}</b></div><div class="muted">${b.name} · ${b.phone}</div><div class="actions"><button class="btn outline small" onclick="changeStatus(${b.id},'confirmed')">confirmed</button><button class="btn outline small" onclick="changeStatus(${b.id},'completed')">completed</button><button class="btn outline small" onclick="changeStatus(${b.id},'cancelled')">cancelled</button></div></div>`).join(''):`<div class="card info-card"><p>${txt('noBookings')}</p></div>`;
 if(state.adminTab==='schedule') body=`<div class="admin-card"><label class="label">${txt('slots')}</label><textarea id="slotInput" class="textarea">${mergedSlots().join(', ')}</textarea><div class="actions"><button class="btn primary" onclick="saveAdminSlots()">${txt('save')}</button></div></div>`;
 if(state.adminTab==='prices') body=`<div class="admin-card">${prices.map((p,i)=>`<div data-price-row style="padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)"><label class="label">RU</label><input data-ru class="input" value="${p.nameRu}"><label class="label">KZ</label><input data-kk class="input" value="${p.nameKk}"><label class="label">₸</label><input data-price class="input" value="${p.price}"></div>`).join('')}<div class="actions"><button class="btn primary" onclick="saveAdminPrices()">${txt('save')}</button></div></div>`;
 if(state.adminTab==='reminders') body=`<div class="note">${txt('waHint')}</div><div style="height:12px"></div>${bookings.map(b=>`<div class="admin-card"><b>${b.name}</b><div class="muted">${b.date} · ${b.time} · ${b.phone}</div><div class="actions"><a class="btn outline small" target="_blank" href="https://wa.me/${b.phone.replace(/\D/g,'')}?text=${encodeURIComponent('Здравствуйте! Напоминаем о записи в Коктем-3 на '+b.date+' в '+b.time)}">WhatsApp</a></div></div>`).join('')||`<div class="card info-card"><p>${txt('noBookings')}</p></div>`}`;
 el.innerHTML=`<h1 class="title">${txt('adminTitle')}</h1><div class="sub">${txt('adminSub')}</div>${tabs}${body}`;
}
function changeStatus(id,status){const arr=getBookings().map(x=>x.id===id?{...x,status}:x); setBookings(arr); renderAdmin();}
function renderAll(){renderHeader(); renderHome(); renderBooking(); renderMy(); renderPrices(); renderAdmin(); showPage(state.page)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
renderAll();
</script>
</body>
</html>
